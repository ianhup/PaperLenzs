# Everything you tune lives here. Read by mlx_lm.lora and by the scripts.

model: mlx-community/gemma-4-e2b-it-4bit   # 4-bit base = QLoRA, leaves RAM for long papers
torch_model: google/gemma-4-E2B-it         # the same model for scripts/train_torch.py (Windows/Linux)
data: data/processed                        # train.jsonl / valid.jsonl from prepare_data.py
adapter_path: outputs/adapters
export_name: paper-summarizer               # name it shows up as in LM Studio

train: true
fine_tune_type: lora
mask_prompt: true          # only learn the summary, not to reproduce the paper
# paper + summary tokens; prepare_data trims longer papers to fit, so re-run it after changing this.
# Peak GPU memory measured on a 24 GB M4 Pro (GPU limit 19.1 GB): 8192 = 14.0 GB, 10240 = 18.4 GB,
# which runs out of memory as soon as other apps use the GPU. Only training is capped: in LM Studio
# the model still reads the whole paper.
max_seq_length: 8192
max_summary_tokens: 1536   # longest summary allowed; training only scores this many positions
grad_checkpoint: true      # trades speed for memory, needed at long lengths
batch_size: 1
grad_accumulation_steps: 4
iters: 300                 # ~ (num papers / 4) * 3-5 epochs; watch val loss
learning_rate: 1.0e-4
num_layers: 16             # LoRA on the last 16 of 35 layers; all layers (-1) needs ~2.5x the memory
lora_parameters:
  rank: 16
  scale: 4.0               # mlx default 20 wrecks Gemma 4 within 10 steps; 4 trains cleanly
  dropout: 0.05
  # attention + MLP only. Without this list mlx also adapts Gemma 4's per-layer embedding
  # gates (per_layer_input_gate / per_layer_projection), which breaks generation.
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj,
         mlp.gate_proj, mlp.up_proj, mlp.down_proj]
steps_per_report: 10
steps_per_eval: 50
val_batches: -1
save_every: 50
seed: 0

# scripts/sweep.py trains one run per entry (each overrides the settings above), scores every
# run on the valid split, and copies the best into adapter_path. Add/remove entries freely.
sweep:
  lr1e-4_r16: {learning_rate: 1.0e-4}
  lr5e-5_r16: {learning_rate: 5.0e-5}
  lr1e-4_r32: {learning_rate: 1.0e-4, lora_parameters: {rank: 32}}
